name: bolcap-release

on:
  push:
    tags: ["bolcap-v*"]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-latest        # arm64
            target: macos-arm64
          - os: macos-15-intel      # macos-13 was retired; this is the Intel label
            target: macos-x64
          - os: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-bolcap.txt pyinstaller

      - name: Build
        run: pyinstaller bolcap.spec --noconfirm

      - name: Smoke test (full pipeline)
        shell: bash
        # Runs first-run setup through the app's own downloader (tiny model),
        # transcribes a generated fixture, and validates a burned render —
        # missing ffprobe, codecs, model data, or fonts all fail here.
        run: bash scripts/smoke_bolcap.sh ./dist/bolcap/bolcap

      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "bolcap-${{ matrix.target }}.zip" bolcap
          else
            zip -qr "bolcap-${{ matrix.target }}.zip" bolcap
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bolcap-${{ matrix.target }}
          path: backend/dist/bolcap-${{ matrix.target }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: "bolcap-*.zip"
          generate_release_notes: true
